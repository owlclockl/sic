// =====================================================================
//  DEADLOCK :: BHOP TRAINER  —  cfg-помощник v2 (русский)
//  Оформление в стиле игры: палитра взята из самого Deadlock
//  (citadel_base_styles.css): кремовый #FFEFD7, золото #FFED79,
//  soul-зелёный #70F8C1, фон #10130D.
//
//  Это НЕ авто-прыжок и не автоматизация. Файл печатает текст и вешает
//  бинды. Все клавиши жмёшь сам.
// ---------------------------------------------------------------------
//  УСТАНОВКА
//    1. Скопируй в:  ...\Deadlock\game\citadel\cfg\
//    2. В игре: настройки -> включить консоль, затем F7
//    3. Ввести:  exec bhop_helper.cfg
//    4. Автозагрузка: добавь строку exec bhop_helper.cfg в autoexec.cfg
//
//  КЛАВИШИ:  J - след. шаг   H - чек-лист   M - скорость   f8 - reload
//            f9 - выключить
//
//  Если вместо русских букв увидишь ????? — используй bhop_helper_latin.cfg
// =====================================================================

// ---------------------------------------------------------------------
// 0. ЦВЕТ ПАНЕЛИ (если команды нет в игре — просто не сработает, панель
//    останется стандартного цвета). Варианты палитры Deadlock:
//      золото ....... FFED79FF   (по умолчанию)
//      soul-зелёный . 70F8C1FF
//      кремовый ..... FFEFD7FF
//      цвет врага ... FF410DFF
// ---------------------------------------------------------------------
log_color Console FFED79FF

// ---------------------------------------------------------------------
// 1. ТИКЕР: на экран выводятся только строки нашей панели (гуттер "::")
// ---------------------------------------------------------------------
developer 1
con_enable 1
con_filter_enable 2
con_filter_text "::"
con_filter_text_out "=>"
con_notifytime 10
contimes 10

echo "::  ======================================================"
echo "::   D E A D L O C K   ::   B H O P   T R A I N E R"
echo "::  ------------------------------------------------------"
echo "::   J - следующий шаг    H - чек-лист    M - скорость"
echo "::  ======================================================"

// ---------------------------------------------------------------------
// 2. ШАГ 1 — AIR STRAFE
// ---------------------------------------------------------------------
alias bhop_h1 "echo ::  ======================================================; echo ::   0 1    A I R   S T R A F E; echo ::  ------------------------------------------------------; echo ::   в воздухе ..... ОТПУСТИ W; echo ::   страф .......... держи A (или D); echo ::   мышь ........... плавно в ту же сторону; echo ::   работает ....... ниже ~450 u/s; echo ::  ======================================================; bind j bhop_h2"

// ---------------------------------------------------------------------
// 3. ШАГ 2 — КРУГ
// ---------------------------------------------------------------------
alias bhop_h2 "echo ::  ======================================================; echo ::   0 2    K R U G; echo ::  ------------------------------------------------------; echo ::   разгон ......... до ~300 u/s; echo ::   держи .......... один страф (напр. D); echo ::   мышь ........... медленно вправо; echo ::   контроль ....... vel на экране (клавиша M); echo ::  ======================================================; bind j bhop_h3"

// ---------------------------------------------------------------------
// 4. ШАГ 3 — ЗМЕЙКА
// ---------------------------------------------------------------------
alias bhop_h3 "echo ::  ======================================================; echo ::   0 3    Z M E J K A; echo ::  ------------------------------------------------------; echo ::   каждый прыжок .. меняй сторону: A -> D -> A; echo ::   W .............. не нажимать; echo ::   цель ........... держать скорость на прыжках; echo ::  ======================================================; bind j bhop_h4"

// ---------------------------------------------------------------------
// 5. ШАГ 4 — СМЕНА СТРАФА ВНУТРИ ПРЫЖКА
// ---------------------------------------------------------------------
alias bhop_h4 "echo ::  ======================================================; echo ::   0 4    SMENA STRAFA VNUTRI PRYZHKA; echo ::  ------------------------------------------------------; echo ::   сначала ........ КЛАВИША (A <-> D); echo ::   потом .......... чуть ПОЗЖЕ камера; echo ::   это ............ самое трудное: 8 из 10 повторов; echo ::  ======================================================; bind j bhop_h5"

// ---------------------------------------------------------------------
// 6. ШАГ 5 — SLIDE HOP
// ---------------------------------------------------------------------
alias bhop_h5 "echo ::  ======================================================; echo ::   0 5    S L I D E   H O P; echo ::  ------------------------------------------------------; echo ::   Ctrl ........... держи, не отпускай; echo ::   прыжок ........ в момент приземления; echo ::   слайд ......... дольше 0.5 с; echo ::   скорость ...... выше ~376 u/s; echo ::   стамина ....... 0 (бесплатно); echo ::  ======================================================; bind j bhop_h6"

// ---------------------------------------------------------------------
// 7. ШАГ 6 — RAW HOP
// ---------------------------------------------------------------------
alias bhop_h6 "echo ::  ======================================================; echo ::   0 6    R A W   H O P; echo ::  ------------------------------------------------------; echo ::   без Ctrl ....... прыжок в кадр касания земли; echo ::   буфер .......... держи прыжок чуть ЗАРАНЕЕ; echo ::   выгодно ........ ниже ~900 u/s; echo ::  ======================================================; bind j bhop_h7"

// ---------------------------------------------------------------------
// 8. ШАГ 7 — DASH JUMP
// ---------------------------------------------------------------------
alias bhop_h7 "echo ::  ======================================================; echo ::   0 7    D A S H   J U M P; echo ::  ------------------------------------------------------; echo ::   Shift .......... даш; echo ::   ~0.2 с ......... ПРЫЖОК (полоска стамины синим); echo ::   приземление .... сразу СЛАЙД; echo ::  ======================================================; bind j bhop_h8"

// ---------------------------------------------------------------------
// 9. ШАГ 8 — FAST CLIMB / CORNER BOOST
// ---------------------------------------------------------------------
alias bhop_h8 "echo ::  ======================================================; echo ::   0 8    F A S T   C L I M B   /   C O R N E R; echo ::  ------------------------------------------------------; echo ::   fast climb ..... W + два прыжка у стены (без стамины); echo ::   corner ......... прыжок ОТ стены на углу; echo ::   первый ......... бесплатно; echo ::  ======================================================; bind j bhop_h1"

// ---------------------------------------------------------------------
// 10. ЧЕК-ЛИСТ И ЦИФРЫ (H)
// ---------------------------------------------------------------------
alias bhop_checklist "echo ::  ======================================================; echo ::   C H I S L A; echo ::  ------------------------------------------------------; echo ::   cap ............ 700 u/s  |  900 со Stamina Mastery; echo ::   air strafe ..... силён ниже ~450 u/s; echo ::   slide-hop ...... жив выше ~376 u/s, слайд > 0.5 с; echo ::  ======================================================; echo ::   P O R J A D O K; echo ::  ------------------------------------------------------; echo ::   1 fast climb   2 dash slide   3 mantle glide; echo ::   4 slide bhop   5 zipline      6 corner boost; echo ::   7 raw bhop; echo ::  ======================================================; echo ::   G L A V N O E; echo ::  ------------------------------------------------------; echo ::   в воздухе НЕ держи W - только A или D + плавная мышь; echo ::  ======================================================"

// ---------------------------------------------------------------------
// 11. СКОРОСТЬ (M)
// ---------------------------------------------------------------------
alias bhop_speed bhop_speed_on
alias bhop_speed_on "sv_cheats 1; cl_showpos 1; echo ::  ======================================================; echo ::   S P E E D   O N; echo ::  ------------------------------------------------------; echo ::   vel ............ твоя скорость; echo ::   держи .......... выше 376 (слайды) и 450 (страф); echo ::  ======================================================; bind m bhop_speed_off"
alias bhop_speed_off "cl_showpos 0; echo ::  ----------  S P E E D   O F F  ----------; bind m bhop_speed_on"

// ---------------------------------------------------------------------
// 12. БИНДЫ
// ---------------------------------------------------------------------
bind j bhop_h1
bind h bhop_checklist
bind m bhop_speed
bind f8 "exec bhop_helper.cfg"
bind f9 "exec bhop_helper_off.cfg"

echo "::  ------------------------------------------------------"
echo "::   готово:  J - шаги,  H - чек-лист,  M - скорость"
echo "::  ======================================================"
