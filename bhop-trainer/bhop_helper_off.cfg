// =====================================================================
//  DEADLOCK :: BHOP TRAINER  —  ВЫКЛЮЧЕНИЕ
//  Убирает панель с экрана, снимает бинды, возвращает цвет консоли.
//  Запуск: F7 -> exec bhop_helper_off.cfg   (или клавиша f9)
// =====================================================================

// цвет консоли обратно в стандартный (если log_color доступен)
log_color Console FFFFFFFF

// панель и отладка
developer 0
con_filter_enable 0
con_filter_text ""
cl_showpos 0

// бинды
unbind j
unbind h
unbind m
unbind f8
unbind f9

echo "::  BHOP TRAINER off. Bindy snjaty, panel vykljuchena."
