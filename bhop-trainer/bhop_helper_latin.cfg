// =====================================================================
//  DEADLOCK :: BHOP TRAINER  —  cfg-помощник v2 (LATIN FALLBACK)
//  То же самое, что bhop_helper.cfg, но весь текст латиницей —
//  используй, если русские буквы показываются как ?????.
//  Палитра и оформление те же: "::" гуттер, золото Deadlock #FFED79.
// ---------------------------------------------------------------------
//  Установка: ...\Deadlock\game\citadel\cfg\   ->   F7   ->   exec bhop_helper_latin.cfg
//  Клавиши:  J - шаги   H - чек-лист   M - скорость   f8 - reload   f9 - off
// =====================================================================

// 0. ЦВЕТ ПАНЕЛИ (золото deadlockGold; альтернативы: 70F8C1FF, FFEFD7FF, FF410DFF)
log_color Console FFED79FF

// 1. ТИКЕР
developer 1
con_enable 1
con_filter_enable 2
con_filter_text "::"
con_filter_text_out "=>"
con_notifytime 10
contimes 10

echo "::  ======================================================"
echo "::   D E A D L O C K   ::   B H O P   T R A I N E R"
echo "::  ------------------------------------------------------"
echo "::   J - next step     H - checklist     M - speed"
echo "::  ======================================================"

// 2. ШАГ 1
alias bhop_h1 "echo ::  ======================================================; echo ::   0 1    A I R   S T R A F E; echo ::  ------------------------------------------------------; echo ::   v vozduhe ..... OTPUSTI W; echo ::   straf .......... derzhi A (ili D); echo ::   mysh ........... plavno v tu zhe storonu; echo ::   rabotaet ....... nizhe ~450 u/s; echo ::  ======================================================; bind j bhop_h2"

// 3. ШАГ 2
alias bhop_h2 "echo ::  ======================================================; echo ::   0 2    K R U G; echo ::  ------------------------------------------------------; echo ::   razgon ......... do ~300 u/s; echo ::   derzhi ......... odin straf (napr. D); echo ::   mysh ........... medlenno vpravo; echo ::   kontrol ........ vel na ekrane (klavisha M); echo ::  ======================================================; bind j bhop_h3"

// 4. ШАГ 3
alias bhop_h3 "echo ::  ======================================================; echo ::   0 3    Z M E J K A; echo ::  ------------------------------------------------------; echo ::   kazhdyj pryzhok ... menjaj storonu: A -> D -> A; echo ::   W ................. ne nazhimat; echo ::   cel ............... derzhat skorost na pryzhkah; echo ::  ======================================================; bind j bhop_h4"

// 5. ШАГ 4
alias bhop_h4 "echo ::  ======================================================; echo ::   0 4    SMENA STRAFA VNUTRI PRYZHKA; echo ::  ------------------------------------------------------; echo ::   snachala ....... KLAVISHA (A <-> D); echo ::   potom .......... chut POZHE kamera; echo ::   eto ............ samoe trudnoe: 8 iz 10 povtorov; echo ::  ======================================================; bind j bhop_h5"

// 6. ШАГ 5
alias bhop_h5 "echo ::  ======================================================; echo ::   0 5    S L I D E   H O P; echo ::  ------------------------------------------------------; echo ::   Ctrl ........... derzhi, ne otpuskaj; echo ::   pryzhok ........ v moment prizemleniya; echo ::   slajd .......... dolshe 0.5 s; echo ::   skorost ........ vyshe ~376 u/s; echo ::   stamina ........ 0 (besplatno); echo ::  ======================================================; bind j bhop_h6"

// 7. ШАГ 6
alias bhop_h6 "echo ::  ======================================================; echo ::   0 6    R A W   H O P; echo ::  ------------------------------------------------------; echo ::   bez Ctrl ....... pryzhok v kadr kasaniya zemli; echo ::   bufer .......... derzhi pryzhok chut ZARANEE; echo ::   vygodno ........ nizhe ~900 u/s; echo ::  ======================================================; bind j bhop_h7"

// 8. ШАГ 7
alias bhop_h7 "echo ::  ======================================================; echo ::   0 7    D A S H   J U M P; echo ::  ------------------------------------------------------; echo ::   Shift .......... dash; echo ::   ~0.2 s ......... PRYZHOK (poloska stamini sinim); echo ::   prizemlenie .... srazu SLAJD; echo ::  ======================================================; bind j bhop_h8"

// 9. ШАГ 8
alias bhop_h8 "echo ::  ======================================================; echo ::   0 8    F A S T   C L I M B   /   C O R N E R; echo ::  ------------------------------------------------------; echo ::   fast climb ..... W + dva pryzhka u steny; echo ::   corner ......... pryzhok OT steny na uglu; echo ::   pervyj ......... besplatno; echo ::  ======================================================; bind j bhop_h1"

// 10. ЧЕК-ЛИСТ
alias bhop_checklist "echo ::  ======================================================; echo ::   C H I S L A; echo ::  ------------------------------------------------------; echo ::   cap ............ 700 u/s  |  900 so Stamina Mastery; echo ::   air strafe ..... silen nizhe ~450 u/s; echo ::   slide-hop ...... zhiv vyshe ~376 u/s, slajd > 0.5 s; echo ::  ======================================================; echo ::   P O R J A D O K; echo ::  ------------------------------------------------------; echo ::   1 fast climb   2 dash slide   3 mantle glide; echo ::   4 slide bhop   5 zipline      6 corner boost; echo ::   7 raw bhop; echo ::  ======================================================; echo ::   G L A V N O E; echo ::  ------------------------------------------------------; echo ::   v vozduhe NE derzhi W - tolko A ili D + plavnaja mysh; echo ::  ======================================================"

// 11. СКОРОСТЬ
alias bhop_speed bhop_speed_on
alias bhop_speed_on "sv_cheats 1; cl_showpos 1; echo ::  ======================================================; echo ::   S P E E D   O N; echo ::  ------------------------------------------------------; echo ::   vel ............ tvoya skorost; echo ::   derzhi ......... vyshe 376 (slajdy) i 450 (straf); echo ::  ======================================================; bind m bhop_speed_off"
alias bhop_speed_off "cl_showpos 0; echo ::  ----------  S P E E D   O F F  ----------; bind m bhop_speed_on"

// 12. БИНДЫ
bind j bhop_h1
bind h bhop_checklist
bind m bhop_speed
bind f8 "exec bhop_helper_latin.cfg"
bind f9 "exec bhop_helper_off.cfg"

echo "::  ------------------------------------------------------"
echo "::   ready:  J - steps,  H - checklist,  M - speed"
echo "::  ======================================================"
